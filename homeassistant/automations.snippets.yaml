# Snippets for automations.yaml.
# media_player.SALA    = your Chromecast Audio (trigger, where the music plays)
# media_player.COZINHA = your Chromecast on the TV (where the image is shown)
# The slideshow_foto_atual / _force scripts call media_player.play_media with the image
# http://HA_HOST:8123/local/current.jpg?t=<timestamp> on media_player.COZINHA.

# ENTER music mode when the speaker starts playing
- id: musica_slideshow_start
  alias: Slideshow - Music mode (speaker playing)
  triggers:
  - {trigger: state, entity_id: media_player.SALA, to: playing}
  - {trigger: state, entity_id: media_player.SALA, attribute: media_content_id}
  - {trigger: state, entity_id: media_player.SALA, attribute: media_title}
  - {trigger: state, entity_id: media_player.SALA, attribute: media_artist}
  conditions:
  - {condition: state, entity_id: media_player.SALA, state: playing}
  actions:
  - {delay: {seconds: 4}}                                  # let the metadata settle
  - {action: homeassistant.update_entity, target: {entity_id: sensor.music_state_writer}}
  - {delay: {seconds: 1}}
  - {action: shell_command.start_musica_slideshow}
  - {delay: {seconds: 4}}
  - {action: script.slideshow_foto_atual_force}           # 1st push of the cover to the TV
  - {delay: {seconds: 12}}
  - {action: script.slideshow_foto_atual_force}           # 2nd push: avoids the "one song behind" bug
  mode: restart

# RETURN to the photo album when the speaker stops
- id: musica_slideshow_stop
  alias: Slideshow - Back to photos (speaker stopped)
  triggers:
  - {trigger: state, entity_id: media_player.SALA, to: ["paused","idle","off","unavailable"]}
  actions:
  - {action: shell_command.stop_musica_slideshow}
  - {delay: {seconds: 1}}
  - {action: shell_command.stop_slideshow_gen}
  - {delay: {seconds: 1}}
  - {action: shell_command.start_slideshow_gen}
  - {delay: {seconds: 4}}
  - {action: script.slideshow_foto_atual_force}           # push the first photo frame to the TV
  - {delay: {seconds: 8}}
  - {action: script.slideshow_foto_atual_force}
  mode: restart

# REFRESH the photo list every night (new photos join the deck; unchanged list = no reload)
- id: slideshow_update_fotos
  alias: Slideshow - Update photo list
  triggers:
  - {trigger: time, at: "03:00:00"}
  actions:
  - {action: shell_command.update_slideshow}
  mode: single

# DISARM the recipe: 30-minute window expired with no play, or cooking ended (speaker stopped 15 min)
- id: recipe_disarm
  alias: Recipe - disarm
  triggers:
  - {trigger: event, event_type: timer.finished, event_data: {entity_id: timer.recipe_window}}
  - {trigger: state, entity_id: media_player.SALA, to: ["idle","off","unavailable"], for: "00:15:00"}
  conditions:
  - {condition: state, entity_id: input_boolean.recipe_armed, state: "on"}
  - condition: not
    conditions:
    - {condition: state, entity_id: media_player.SALA, state: playing}
  actions:
  - {action: shell_command.disarm_music_recipe}
  - {action: input_boolean.turn_off, target: {entity_id: input_boolean.recipe_armed}}
  - {action: timer.cancel, target: {entity_id: timer.recipe_window}}
  mode: single
