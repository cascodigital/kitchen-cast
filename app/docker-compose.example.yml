services:
  kitchen-cast:
    build: .
    image: kitchen-cast:latest
    container_name: kitchen-cast
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC
      - HASS_URL=http://homeassistant.local:8123
      - HASS_TOKEN=${HASS_TOKEN}
      - WORKER_CONTAINER=claude-worker          # name of your headless Claude Code worker container
      - YTM_MCP_CONFIG=/home/claude/ai/mcp/youtube-music/mcp-config.json
      - YTM_AUTH_FILE=/auth/ytmusic_auth.json
      - RECIPES_DIR=/recipes
      # Home Assistant timer started on arm; must match the timer id in configuration.snippets.yaml
      - RECIPE_TIMER_ENTITY=timer.recipe_window
      # paths below are INSIDE the worker container
      - WORKER_USER=claude                      # user that runs the claude CLI in the worker
      - ROLO_SKILL_FILE=/home/claude/rolo/SKILL.md   # appended as system prompt on every job
      # delivery check; gets --playlist-id <id> --since <epoch>, must print {"ok": true} and exit 0
      - ROLO_DELIVERY_CMD=python3 /home/claude/rolo/rolo_curate.py delivery
    volumes:
      # your recipes (.txt, one file per recipe), mounted read-only
      - /PATH/TO/your/recipes:/recipes:ro
      # Docker socket, for 'docker exec' into the worker that creates the playlist
      - /var/run/docker.sock:/var/run/docker.sock
      # YouTube Music auth (ytmusicapi) to list existing playlists
      - /PATH/TO/ytmusic_auth.json:/auth/ytmusic_auth.json:ro
    ports:
      - "8095:8000"
